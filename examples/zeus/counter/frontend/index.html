<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Zeus WASM API</title>
  <link rel="preload" href="/loader.js" as="script" />
  <link rel="preload" href="/app.wasm" as="fetch" type="application/wasm" crossorigin />
  <style>
    html, body { margin: 0; height: 100%; background: #fafafa; }
    canvas#zeus {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="zeus" data-wasm="/app.wasm"></canvas>
  <script src="/loader.js"></script>
</body>
</html>
